name: Release build

# Builds the exe from the tagged source on GitHub's runners, so every
# release binary can be traced back to a commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyQt6 soundcard sounddevice soundfile numpy lameenc keyboard pyinstaller pytest

      - name: Test
        run: python -m pytest

      - name: Build
        # UPX-packed exes get flagged by antivirus scanners far more often (#10)
        run: pyinstaller --noconsole --onefile --noupx --name QuickAudioRecorder main.py

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/QuickAudioRecorder.exe -Algorithm SHA256).Hash + "  QuickAudioRecorder.exe" | Out-File -Encoding ascii dist/QuickAudioRecorder.exe.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --draft --title "QuickAudioRecorder ${{ github.ref_name }}" --notes ""
          gh release upload ${{ github.ref_name }} dist/QuickAudioRecorder.exe dist/QuickAudioRecorder.exe.sha256 --clobber
